hero:
  eyebrow: Theoretical physics · Analog computing · Dresden
  headline: Clocks that agree without a conductor
  standfirst: >-
    I work on self-organized synchronization: how a network of oscillators — cells
    in a developing embryo, phase-locked loops on a circuit board, 24 GHz oscillators
    half a kilometre apart — settles into a common rhythm when every signal between
    them arrives late. Delay is normally the thing you design around. It is also a
    parameter you can design with. These days I build computers out of it, as Chief
    Scientific Officer at anabrid.
  figure_caption: >-
    Twelve mutually delay-coupled clocks, integrated in your browser from the same
    phase model used in the papers below. No reference clock, no master. The strokes
    turn amber once the order parameter passes 0.95.
  figure_note: No reference clock

