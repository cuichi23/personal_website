<!doctype html>
<meta charset="utf-8">
<title>Europe blind map proof sheet</title>
<!-- Checks every drop target in map.json against its own geometry, inside a
     real browser, because isPointInFill exists nowhere else. It also runs one
     end-to-end pointer drag and then solves the current round so the labels,
     highlights and pins can be proof-read by eye.

     Copy this file into docs/ and open it over the preview server:
       cp tools/map_proof.html docs/ && xdg-open http://localhost:8778/map_proof.html
     The absolute /media/... paths only resolve from there; build.py wipes
     docs/, so the copy is made fresh each time.

     It uses the window.__EBM_TEST__ hook at the end of applet.js, which stays
     inert on the live page. -->
<style>body{font:13px/1.45 monospace;margin:1rem}.ebm{max-width:900px}</style>
<script>window.__EBM_TEST__ = true;</script>
<script src="/media/europe-blind-map/applet.js"></script>
<pre id="out">running…</pre><div id="host"></div>
<script>
(function(){
  var xhr=new XMLHttpRequest();
  xhr.open("GET","/media/europe-blind-map/map.json",false);
  xhr.send();
  var data=JSON.parse(xhr.responseText);
  var host=document.getElementById("host");
  host.className="ebm";
  var style=document.createElement("style");
  style.textContent=window.__EBM_TEST__.css;
  document.head.appendChild(style);
  var g=new window.__EBM_TEST__.Game(host,data);

  function own(it){var t=it.t;
    if(t.k==="poly")return{x:it.lab[0],y:it.lab[1]};
    if(t.k==="pt")return{x:t.x,y:t.y};
    var p=t.pts.filter(function(q){return q[0]!==null;});
    return{x:p[Math.floor(p.length/2)][0],y:p[Math.floor(p.length/2)][1]};}

  var lines=[],selfFail=0,falseHit=0,cats={};
  data.items.forEach(function(it){
    var v=g.judge(it,own(it));
    cats[it.cat]=cats[it.cat]||[0,0]; cats[it.cat][1]++;
    if(v.ok)cats[it.cat][0]++;
    else{selfFail++;lines.push("SELF-MISS "+it.id+" "+it.en+" far="+v.far.toFixed(1)+" side="+v.side);}
    var o=own(it),off={x:Math.min(data.view[0]-5,o.x+300),y:Math.min(data.view[1]-5,o.y+200)};
    if(g.judge(it,off).ok){falseHit++;lines.push("FALSE-HIT "+it.id+" "+it.en);}
  });
  function byId(id){return data.items.filter(function(i){return i.id===id;})[0];}
  var baltic=byId("w-baltic"),gotland=byId("i-gotland"),north=byId("w-northsea");
  var seaOnIsland=g.judge(baltic,{x:gotland.t.x,y:gotland.t.y});
  var islandAtSea=g.judge(gotland,{x:north.t.x,y:north.t.y});
  var lux=byId("c-lu"), luxNear=g.judge(lux,{x:lux.lab[0]+8,y:lux.lab[1]+5});
  var fr=byId("c-fr"), frNear=g.judge(fr,{x:fr.lab[0]+8,y:fr.lab[1]+5});
  var frFar=g.judge(fr,{x:byId("c-pl").lab[0],y:byId("c-pl").lab[1]});
  var danube=byId("r-danube"), danubeOff=g.judge(danube,{x:danube.lab[0],y:danube.lab[1]-40});

  var item=g.round[0],chip=g.chips[item.id];
  var ctm=g.map.getScreenCTM(),p=own(item);
  var sx=ctm.a*p.x+ctm.c*p.y+ctm.e, sy=ctm.b*p.x+ctm.d*p.y+ctm.f;
  function pe(t,x,y,el){el.dispatchEvent(new PointerEvent(t,{pointerId:1,bubbles:true,clientX:x,clientY:y,button:0}));}
  var cr=chip.getBoundingClientRect();
  pe("pointerdown",cr.left+10,cr.top+10,chip);
  pe("pointermove",cr.left+40,cr.top+40,chip);
  pe("pointermove",sx,sy,chip);
  pe("pointerup",sx,sy,chip);
  var dragOk=chip.classList.contains("ebm__chip--gone");
  var labelOk=g.answers.querySelectorAll("text").length===1;

  var h=["items "+data.items.length+", shapes "+data.shapes.length];
  Object.keys(cats).forEach(function(c){h.push("  "+c+": "+cats[c][0]+"/"+cats[c][1]+" hit their own target");});
  h.push("self-misses "+selfFail+", false hits 300/200 away "+falseHit);
  h.push("Baltic dropped on Gotland rejected: "+(!seaOnIsland.ok)+" (side="+seaOnIsland.side+")");
  h.push("Gotland dropped in the North Sea rejected: "+(!islandAtSea.ok)+" (side="+islandAtSea.side+")");
  h.push("Luxembourg accepts a near miss (small-country slack): "+luxNear.ok);
  h.push("France accepts a point just off its label: "+frNear.ok);
  h.push("France rejected when dropped on Poland: "+(!frFar.ok));
  h.push("Danube rejected 40 units off its line: "+(!danubeOff.ok));
  h.push("drag placed '"+item.en+"': "+dragOk+", label pinned: "+labelOk);

  // ------------------------------------------------------- four languages
  // A missing name shows up as "undefined" on a chip, and only in the one
  // language nobody opened. So check the data and the interface together.
  var LANGS=window.__EBM_TEST__.langs,TEXT=window.__EBM_TEST__.text;
  var noName=[],noNote=[];
  data.items.forEach(function(it){
    LANGS.forEach(function(l){
      if(!it[l])noName.push(it.id+"."+l);
      // notes come in all four or in none: a pair is taught in whatever
      // language the player chose, or it is not taught at all
      if(it.nde&&!it["n"+l])noNote.push(it.id+".n"+l);});});
  var keyMiss=[];
  var deKeys=Object.keys(TEXT.de);
  LANGS.forEach(function(l){
    deKeys.forEach(function(k){
      if(TEXT[l][k]===undefined)keyMiss.push(l+"."+k);});
    Object.keys(TEXT[l].cats).forEach(function(k){
      if(!TEXT[l].cats[k])keyMiss.push(l+".cats."+k);});
    if(TEXT[l].levels.length!==3)keyMiss.push(l+".levels");});
  // The switch has to reach the names on the chips and the words on the
  // buttons. Checked through name() and retext() rather than by starting a
  // new round: a new round clears the pinned label the zoom tests below need.
  var langLive=LANGS.every(function(l){
    g.lang=l;
    var names=data.items.map(function(it){return g.name(it);}).join("|");
    g.retext();
    return names.indexOf("undefined")<0
      &&g.catButtons.all.textContent===TEXT[l].cats.all
      &&g.nextButton.textContent===TEXT[l].next
      &&g.map.getAttribute("aria-label")===TEXT[l].mapLabel;});
  g.lang="de";g.retext();
  var langGood=!noName.length&&!noNote.length&&!keyMiss.length&&langLive;
  h.push("names in "+LANGS.join("/")+" on all "+data.items.length
         +" items: "+(!noName.length)+(noName.length?" missing "+noName.slice(0,6):""));
  h.push("notes complete wherever there is one: "+(!noNote.length)
         +(noNote.length?" missing "+noNote.slice(0,6):""));
  h.push("interface text complete in every language: "+(!keyMiss.length)
         +(keyMiss.length?" missing "+keyMiss.slice(0,6):""));
  h.push("switching the language reaches the names and the buttons: "+langLive);

  var good=selfFail===0&&falseHit===0&&!seaOnIsland.ok&&!islandAtSea.ok&&luxNear.ok&&frNear.ok&&!frFar.ok&&!danubeOff.ok&&dragOk&&labelOk&&langGood;
  h.push(good?"=== ALL GOOD ===":"=== PROBLEMS ===");
  document.getElementById("out").textContent=h.concat(lines).join("\n");

  // ------------------------------------------------------------ zoom tests
  // The viewBox is the whole of the zoom, so the question these answer is
  // whether every screen-to-map conversion still goes through it.
  var zl=[];
  function screenOf(mp){var m=g.map.getScreenCTM();
    return{x:m.a*mp.x+m.c*mp.y+m.e,y:m.b*mp.x+m.d*mp.y+m.f};}
  function label(){return g.answers.querySelector("text")||g.map.querySelector("text");}
  function labelPx(){var t=label();if(!t)return null;
    return parseFloat(getComputedStyle(t).fontSize)*g.map.getScreenCTM().a;}

  g.resetZoom();
  var fullBox=g.map.getAttribute("viewBox");
  var pxAt1=labelPx();

  // Zooming about a screen point must leave the map point under it in place.
  var anchorScreen=screenOf({x:data.view[0]*0.62,y:data.view[1]*0.42});
  var beforeAnchor=g.toMap(anchorScreen.x,anchorScreen.y);
  g.zoomAt(4,anchorScreen.x,anchorScreen.y);
  var afterAnchor=g.toMap(anchorScreen.x,anchorScreen.y);
  var anchorDrift=Math.hypot(beforeAnchor.x-afterAnchor.x,beforeAnchor.y-afterAnchor.y);
  var zoomIs4=Math.abs(g.zoom-4)<0.01;
  var pxAt4=labelPx();
  var pxHeld=pxAt1&&pxAt4&&Math.abs(pxAt1-pxAt4)<0.6;

  // A drop placed at the screen position of a country's label must still be
  // judged against that country while the map is zoomed in.
  var fr2=byId("c-fr");
  g.resetZoom();
  var frScreen=screenOf({x:fr2.lab[0],y:fr2.lab[1]});
  g.zoomAt(5,frScreen.x,frScreen.y);
  var frScreen2=screenOf({x:fr2.lab[0],y:fr2.lab[1]});
  var zoomedHit=g.judge(fr2,g.toMap(frScreen2.x,frScreen2.y)).ok;
  var zoomedMiss=!g.judge(byId("c-pl"),g.toMap(frScreen2.x,frScreen2.y)).ok;

  // The view may never show anything outside the map.
  g.zoom=40;g.vx=-9e4;g.vy=-9e4;g.applyView();
  var lowClamp=g.vx===0&&g.vy===0;
  g.vx=9e4;g.vy=9e4;g.applyView();
  var vb=g.map.getAttribute("viewBox").split(" ").map(Number);
  var highClamp=Math.abs(vb[0]+vb[2]-data.view[0])<0.01
               &&Math.abs(vb[1]+vb[3]-data.view[1])<0.01;
  var capped=g.zoom<=8.001;

  // Two synthetic fingers spreading apart have to zoom in.
  g.resetZoom();
  function tp(t,id,x,y){g.map.dispatchEvent(new PointerEvent(t,
    {pointerId:id,pointerType:"touch",bubbles:true,clientX:x,clientY:y,button:0}));}
  var mr=g.map.getBoundingClientRect(),mcx=mr.left+mr.width/2,mcy=mr.top+mr.height/2;
  tp("pointerdown",11,mcx-40,mcy);tp("pointerdown",12,mcx+40,mcy);
  tp("pointermove",11,mcx-120,mcy);tp("pointermove",12,mcx+120,mcy);
  var pinchZoomed=g.zoom>1.4;
  tp("pointerup",11,mcx-120,mcy);tp("pointerup",12,mcx+120,mcy);

  // One finger pushes the map around once it is zoomed, and the pan must not
  // then be read as a tap that places a name.
  var vxBefore=g.vx;
  tp("pointerdown",13,mcx,mcy);tp("pointermove",13,mcx-60,mcy);
  var panned=g.vx>vxBefore+1;
  tp("pointerup",13,mcx-60,mcy);
  var swallowed=g.swallowClick===true;

  // A stale swallow must clear itself on the next touch, or the tap after a
  // cancelled pan would silently place nothing.
  tp("pointerdown",14,mcx,mcy);
  var swallowCleared=g.swallowClick===false;
  tp("pointerup",14,mcx,mcy);

  g.resetZoom();
  var backToFull=g.map.getAttribute("viewBox")===fullBox;

  // Full screen, pinned flavour: the layout class goes on and comes off, and
  // the scale is still a sane number afterwards.
  g.pinFull(true);
  var fsOn=g.mount.classList.contains("ebm--fsmode")
          &&g.mount.classList.contains("ebm--fsfix")&&g.full===true;
  // While full screen is on, a dragged name must still be visible. The ghost
  // used to be appended to document.body, where a real full screen paints
  // nothing and the pinned fallback's own z-index covers it.
  var fsItem=null,fsChip=null;
  for(var fi=0;fi<g.round.length;fi++){
    if(g.chips[g.round[fi].id]&&!g.chips[g.round[fi].id].classList.contains("ebm__chip--gone")){
      fsItem=g.round[fi];fsChip=g.chips[fsItem.id];break;
    }
  }
  var ghostInMount=false,ghostFixed=false,ghostFollows=false,fsDropOk=false;
  if(fsChip){
    var fcr=fsChip.getBoundingClientRect();
    pe("pointerdown",fcr.left+10,fcr.top+10,fsChip);
    pe("pointermove",fcr.left+40,fcr.top+40,fsChip);
    var gh=g.mount.querySelector(".ebm__ghost");
    if(gh){
      ghostInMount=g.mount.contains(gh);
      var gs=getComputedStyle(gh);
      ghostFixed=gs.position==="fixed"&&gs.display!=="none"&&gs.visibility!=="hidden";
      pe("pointermove",fcr.left+90,fcr.top+70,fsChip);
      var gr=gh.getBoundingClientRect();
      ghostFollows=Math.abs(gr.left+gr.width/2-(fcr.left+90))<2;
    }
    var fctm=g.map.getScreenCTM(),fp=own(fsItem);
    var fsx=fctm.a*fp.x+fctm.c*fp.y+fctm.e,fsy=fctm.b*fp.x+fctm.d*fp.y+fctm.f;
    pe("pointermove",fsx,fsy,fsChip);
    pe("pointerup",fsx,fsy,fsChip);
    fsDropOk=fsChip.classList.contains("ebm__chip--gone");
  }
  var ghostGone=!g.mount.querySelector(".ebm__ghost");

  g.pinFull(false);
  var fsOff=!g.mount.classList.contains("ebm--fsmode")
           &&!g.mount.classList.contains("ebm--fsfix")&&g.full===false
           &&document.documentElement.style.overflow==="";
  g.updateScale();
  var scaleSane=g.unitsPerPx>0.1&&g.unitsPerPx<40;

  zl.push("zoom 4x reached: "+zoomIs4+", anchor drift "+anchorDrift.toFixed(2)+" units");
  zl.push("label stays "+(pxAt1?pxAt1.toFixed(1):"?")+" -> "
          +(pxAt4?pxAt4.toFixed(1):"?")+" screen px: "+pxHeld);
  zl.push("France still hit when zoomed 5x: "+zoomedHit+", Poland still not: "+zoomedMiss);
  zl.push("view clamped at both edges: "+(lowClamp&&highClamp)+", zoom capped at 8: "+capped);
  zl.push("two-finger spread zoomed in: "+pinchZoomed);
  zl.push("one-finger pan moved the view: "+panned+", pan swallowed the click: "+swallowed);
  zl.push("stale swallow cleared on the next touch: "+swallowCleared);
  zl.push("reset returned the whole map: "+backToFull);
  zl.push("full screen on: "+fsOn+", off: "+fsOff+", scale sane: "+scaleSane);
  zl.push("full-screen drag: ghost inside the mount: "+ghostInMount
          +", visible and fixed: "+ghostFixed+", follows the pointer: "+ghostFollows);
  zl.push("full-screen drop placed '"+(fsItem?fsItem.en:"?")+"': "+fsDropOk
          +", ghost removed after: "+ghostGone);
  var zoomGood=zoomIs4&&anchorDrift<1.5&&pxHeld&&zoomedHit&&zoomedMiss&&lowClamp
    &&highClamp&&capped&&pinchZoomed&&panned&&swallowed&&backToFull&&swallowCleared&&fsOn&&fsOff&&scaleSane
    &&ghostInMount&&ghostFixed&&ghostFollows&&fsDropOk&&ghostGone;
  zl.push(zoomGood?"=== ZOOM GOOD ===":"=== ZOOM PROBLEMS ===");
  document.getElementById("out").textContent+="\n"+zl.join("\n");

  // Solve what is left of the round so the pins, the names and the two kinds
  // of highlight (a filled country, a traced river or ridge, a ring around a
  // point) can all be checked by eye in one picture.
  g.round.forEach(function(it){ if(!it.__done) g.settle(it, true); });
})();
</script>
